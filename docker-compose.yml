# web, horizon (queue) and scheduler share one image; web builds it from the Dockerfile,
# the others only use it (never pulled: it exists only locally)
x-php: &php
  # PHP 8.5.12 – keep in sync with the Dockerfile
  image: ${APP_NAME:-pixelfed}-php:8.5.12
  pull_policy: never
  restart: always
  volumes:
    - ${APACHE_HTDOCS:-./src/htdocs}:/var/www/html
    - ./config/php/php.ini:/usr/local/etc/php/conf.d/zz-pixelfed.ini:ro
  environment:
    TZ: ${TZ:-Europe/Berlin}
  networks:
    - pxf-network
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *php
    build: .
    pull_policy: build
    container_name: ${APP_NAME:-pixelfed}-apache
    volumes:
      - ${APACHE_HTDOCS:-./src/htdocs}:/var/www/html
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/zz-pixelfed.ini:ro
      - ./config/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    ports:
      - "${APACHE_BIND:-127.0.0.1}:${APACHE_PORT:-8080}:80"

  horizon:
    <<: *php
    container_name: ${APP_NAME:-pixelfed}-horizon
    user: www-data
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s

  scheduler:
    <<: *php
    container_name: ${APP_NAME:-pixelfed}-scheduler
    user: www-data
    command: ["php", "artisan", "schedule:work"]

  db:
    image: mariadb:${MARIADB_VERSION:-12.3}
    restart: always
    container_name: ${APP_NAME:-pixelfed}-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      # upgrades the data directory after a MariaDB version change
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${MARIADB_LOCAL_DIR:-./mariadb/data}${MARIADB_DATA_DIR:-/lib}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - pxf-network

  redis:
    image: redis:8
    restart: always
    container_name: ${APP_NAME:-pixelfed}-redis
    networks:
      - pxf-network

networks:
  pxf-network:
    driver: bridge
